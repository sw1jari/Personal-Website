<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Site.Title }}{{ if not .IsHome }} - {{ .Title }}{{ end }}</title>
  <style>
    :root { --accent: #0066cc; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; line-height: 1.6; color: #333; }
    h1 { margin: 0.5em 0; }
    h2 { margin-top: 1.5em; margin-bottom: 0.3em; font-size: 1.3em; }
    h3 { margin-top: 1em; margin-bottom: 0.2em; font-size: 1.1em; color: #555; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    nav { margin: 30px 0; border-bottom: 1px solid #eee; padding-bottom: 15px; }
    nav a { margin-right: 25px; font-weight: 500; }
    nav a.active { color: var(--accent); text-decoration: underline; }
    main { margin: 40px 0; }
    footer { margin-top: 60px; padding-top: 20px; border-top: 1px solid #eee; font-size: 0.9em; color: #666; }
    code { background: #f5f5f5; padding: 2px 6px; border-radius: 3px; font-family: monospace; font-size: 0.9em; }
    pre { background: #f5f5f5; padding: 15px; border-radius: 3px; overflow-x: auto; }
    .job { margin: 20px 0; padding: 15px; background: #fafafa; border-left: 3px solid var(--accent); }
    .job h3 { margin-top: 0; }
    .job-meta { font-size: 0.9em; color: #666; }
    button { background: var(--accent); color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
    button:hover { opacity: 0.9; }
    .recipe-controls { margin: 15px 0; display: flex; gap: 10px; }
    .ingredient { margin: 5px 0; }
    .ingredient-amount { font-weight: 500; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ "" | relURL }}">Home</a>
    <a href="{{ "photos/" | relURL }}">Photos</a>
    <a href="{{ "recipes/" | relURL }}">Recipes</a>
  </nav>
  <main>{{ block "main" . }}{{ end }}</main>
  <footer>
    <p>&copy; Jari Kasandiredjo. All rights reserved.</p>
  </footer>
</body>
</html>
