{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ if .Params.credit }}<p style="color:#666;">Recipe by
  {{ if .Params.credit_url }}<a href="{{ .Params.credit_url }}">{{ .Params.credit }}</a>{{ else }}{{ .Params.credit }}{{ end }}
  {{ if .Params.video_url }}· <a href="{{ .Params.video_url }}">video</a>{{ end }}
</p>{{ end }}

<div class="recipe-controls">
  <label>Servings:
    <input id="people" type="number" min="1" step="1" value="{{ .Params.servings | default 4 }}" style="width:60px;">
  </label>
  <button type="button" id="toggle">Hide amounts in steps</button>
</div>

<div id="recipe">
{{ .Content }}
</div>

<script>
const BASE = {{ .Params.servings | default 4 }};
const recipe = document.getElementById('recipe');

// Mark everything under the "Instructions" heading so the toggle only hits steps.
let inSteps = false;
for (const el of recipe.children) {
  if (/^h[1-6]$/i.test(el.tagName)) inSteps = /instruction|step|method/i.test(el.textContent);
  else if (inSteps) el.classList.add('steps');
}

// Turn [amount] markers into scalable spans.
function wrap(node) {
  if (node.nodeType === 3) {
    const parts = node.textContent.split(/(\[[^\]]+\])/);
    if (parts.length === 1) return;
    const frag = document.createDocumentFragment();
    for (const p of parts) {
      const m = p.match(/^\[(.+)\]$/);
      if (m) {
        const span = document.createElement('span');
        span.className = 'amt';
        span.dataset.orig = m[1];
        span.textContent = m[1];
        if (node.parentElement.closest('.steps')) span.classList.add('amt-step');
        frag.appendChild(span);
      } else {
        frag.appendChild(document.createTextNode(p));
      }
    }
    node.replaceWith(frag);
  } else if (node.nodeType === 1) {
    [...node.childNodes].forEach(wrap);
  }
}
wrap(recipe);

function parseNum(t) {
  const mix = t.match(/^(\d+)\s+(\d+)\/(\d+)$/);
  if (mix) return +mix[1] + (+mix[2] / +mix[3]);
  const frac = t.match(/^(\d+)\/(\d+)$/);
  if (frac) return +frac[1] / +frac[2];
  return parseFloat(t);
}

function fmt(n) {
  const r = Math.round(n);
  if (Math.abs(n - r) < 0.02) return String(r);
  if (n >= 10) return String(Math.round(n));
  if (n < 4) {
    const whole = Math.floor(n), frac = n - whole;
    const table = [[0.25,'1/4'],[0.33,'1/3'],[0.5,'1/2'],[0.67,'2/3'],[0.75,'3/4']];
    for (const [v, s] of table)
      if (Math.abs(frac - v) < 0.04) return (whole ? whole + ' ' : '') + s;
  }
  return n.toFixed(1).replace(/\.0$/, '');
}

function scale() {
  const people = Math.max(1, parseInt(document.getElementById('people').value) || BASE);
  const factor = people / BASE;
  document.querySelectorAll('.amt').forEach(el => {
    el.textContent = el.dataset.orig.replace(
      /\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?/g,
      t => fmt(parseNum(t) * factor));
  });
}

let hidden = false;
document.getElementById('toggle').addEventListener('click', e => {
  hidden = !hidden;
  document.querySelectorAll('.amt-step').forEach(el => el.style.display = hidden ? 'none' : '');
  e.target.textContent = hidden ? 'Show amounts in steps' : 'Hide amounts in steps';
});

document.getElementById('people').addEventListener('input', scale);
scale();
</script>
{{ end }}
